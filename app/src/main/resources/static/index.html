<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./assets/images/logo/logo.png"/>
    <link rel="stylesheet" href="./assets/css/index.css">
    <link rel="stylesheet" href="./assets/css/style.css">
    <script src="./js/util.js" defer></script>
    <script src="./js/render.js" defer></script>
    <script src="./js/components/header.js" defer></script>
    <script src="./js/components/footer.js" defer></script>
    <title>Clinic Management System</title>
</head>
<body>
    <div class="container">
        <div class="wrapper">
            <div id="header"></div>
            <main class="main-content">
                <h2>Select Your Role</h2>
                <button id="adminLogin" class="dashboard-btn" onclick="selectRole('admin')">Admin</button>
                <button id="doctorLogin" class="dashboard-btn" onclick="selectRole('doctor')">Doctor</button>
                <button id="patientLogin" class="dashboard-btn" onclick="selectRole('patient')">Patient</button>
            </main>
            <div id="footer"></div>
        </div>
    </div>

    <!-- Modal: hidden by default, opened via openModal() from js/components/modals.js -->
    <div id="modal" class="modal">
        <span id="closeModal" class="close">&times;</span>
        <div id="modal-body"></div>
    </div>

    <script type="module" src="../js/services/index.js" defer></script>
</body>
</html>
